<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page introuvable | Solaris Pro</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-page">

<div class="auth-wrapper">
    <section class="auth-visual">
        <a href="index.html" class="brand">
            <div class="brand-logo">
                <i class="fa-solid fa-solar-panel"></i>
            </div>
            <div class="brand-text">
                <strong>Solaris Pro</strong>
                <span>ÉNERGIE SOLAIRE</span>
            </div>
        </a>

        <div class="auth-visual-content">
            <span class="auth-kicker">ERREUR 404</span>
            <h1>Cette page n'existe pas.</h1>
            <p>
                Le lien utilisé est peut-être incorrect ou la page a été déplacée.
            </p>
        </div>
    </section>

    <section class="auth-form-section">
        <div class="auth-form-container">
            <span class="page-eyebrow">SOLARIS PRO</span>
            <h2>Page introuvable</h2>
            <p class="auth-description">
                Revenez à l'accueil ou connectez-vous à votre espace.
            </p>

            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;">
                <a href="index.html" class="btn btn-primary">
                    <i class="fa-solid fa-house"></i>
                    Accueil
                </a>
                <a href="login.html" class="btn btn-outline">
                    Connexion
                </a>
            </div>
        </div>
    </section>
</div>

</body>
</html>
